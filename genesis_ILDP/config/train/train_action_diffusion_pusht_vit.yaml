# === TRAINING CONFIGURATION FOR ACTION DIFFUSION WITH VISION TRANSFORMER ===
# This config uses Vision Transformer (ViT) as the vision backbone instead of ResNet
# Based on train_action_diffusion_pusht_image.yaml with ViT-specific settings

_target_: genesis_ILDP.workspace.train_action_diffusion_image_workspace.TrainActionDiffusionImageWorkspace

# === EXPERIMENT SETTINGS ===
exp_name: "action_diffusion_pusht_vit_small"
task_name: pusht_image_vit
name: train_action_diffusion_vit

# === STANDARD DIFFUSION PARAMETERS ===
horizon: 16                    # Predict 16 action steps
n_action_steps: 8             # Execute first 8 actions
n_obs_steps: 2                # Use 2 observation frames
n_latency_steps: 0            # No latency compensation
dataset_obs_steps: 2          # Dataset observation steps
obs_as_global_cond: true      # Use observations as global conditioning
past_action_visible: false    # Don't show past actions
keypoint_visible_rate: 1.0    # Not used for image policy

# === SHAPE METADATA ===
shape_meta:
  action:
    shape: [2]                 # 2D action space (x, y coordinates)
  obs:
    image:
      shape: [3, 96, 96]       # RGB images 96x96
      type: rgb
    agent_pos:
      shape: [2]               # 2D agent position
      type: low_dim

# === POLICY CONFIGURATION ===
policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy.ActionDiffusionImagePolicy

  # Shape and basic parameters
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_steps: ${n_obs_steps}
  enable_crop: true
  crop_shape: [3, 88, 88]      # Crop to 88x88 for ViT input

  # Diffusion parameters
  diff_steps: 100              # Number of diffusion steps
  scheduler_mode: 'Cosine'     # Scheduler mode

  # Encoding settings
  img_encoding_dim: 512        # Output feature dimension
  time_encoding_dim: 128       # Time step encoding dimension
  pos_encoding_dim: null       # No positional encoding
  encode_agent_pos: false      # Set to false to match reference DP architecture

  # === VISION TRANSFORMER BACKBONE CONFIGURATION ===
  # Using ViT-Small for better performance on smaller images (88x88 cropped)
  vision_backbone: 'vit_small'
  vision_pretrained: false     # Train from scratch

  # ViT-specific parameters
  vit_patch_size: 8            # 8x8 patches (88/8 = 11 patches per dimension)
  vit_depth: 12                # 12 transformer layers (ViT-Small default)
  vit_num_heads: 6             # 6 attention heads (ViT-Small default)
  vit_mlp_ratio: 4.0           # MLP ratio 4.0 (standard)
  vit_use_cls_token: true      # Use [CLS] token for image representation
  # vit_embed_dim: 384         # Not needed for vit_small (auto-set to 384)

  # Dropout settings for regularization
  vision_encoder_dropout: 0.1  # ViT dropout rate (applied in attention and MLP)
  pos_encoder_dropout: 0.0     # Dropout rate for position encoder
  unet_dropout: 0.0            # Dropout rate for UNet FiLM layers
  time_encoder_dropout: 0.0    # Dropout rate for time encoding MLP

# === TASK CONFIGURATION ===
task:
  name: pusht_image
  shape_meta: ${shape_meta}

  # Dataset configuration
  dataset:
    _target_: genesis_ILDP.dataset.pusht_image_dataset.PushTImageDataset
    zarr_path: genesis_ILDP/data/train_data/merged_data_0925.zarr
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}     # 1
    pad_after: ${eval:'${n_action_steps}-1'}   # 7
    seed: 42
    val_ratio: 0.05
    max_train_episodes: null

  # Environment runner
  env_runner:
    _target_: genesis_ILDP.env_runner.pusht_image_runner.PushTImageRunner
    output_dir: ${multi_run.run_dir}
    fps: 30
    max_steps: 600
    n_action_steps: ${n_action_steps}
    n_obs_steps: ${n_obs_steps}
    n_test: 60
    n_test_vis: 8
    n_train: 10
    n_train_vis: 2
    test_start_seed: 50000
    train_start_seed: 0
    n_envs: null
    enable_past_action: False
    enable_render: True
    done_ratio: 0.7

# === TRAINING CONFIGURATION ===
training:
  seed: 42
  device: cuda:0
  num_epochs: 500             # Standard training epochs
  batch_size: 64              # Reduced batch size for ViT (uses more memory)
  deterministic: true
  worker_seed_strategy: offset

  # Learning and optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1

  # Checkpointing and evaluation
  checkpoint_every: 50         # Save checkpoint every 50 epochs
  val_every: 5                 # Validate every 5 epochs
  rollout_every: 50            # Run environment rollout every 50 epochs
  sample_every: 5              # Sample predictions every 5 epochs

  # Limits
  max_train_steps: null
  max_val_steps: null

  # Debugging and logging
  debug: false
  tqdm_interval_sec: 1.0
  use_ema: true                # Use exponential moving average
  resume: false

# === OPTIMIZER CONFIGURATION ===
# Using slightly higher learning rate for ViT (common practice)
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0003                   # Higher LR for ViT (was 0.0001 for ResNet)
  betas: [0.9, 0.999]          # Standard AdamW betas for ViT
  eps: 1.0e-08
  weight_decay: 0.05           # Higher weight decay for ViT (was 1e-5 for ResNet)

# === DATA LOADING ===
dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle: true
  drop_last: true

val_dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle: false

# === EMA CONFIGURATION ===
ema:
  _target_: genesis_ILDP.model.common.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# === CHECKPOINT CONFIGURATION ===
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# === LOGGING CONFIGURATION ===
logging:
  mode: online
  project: genesis_ILDP_action_diffusion
  group: action_diffusion_pusht_vit
  name: ${exp_name}_${now:%Y.%m.%d-%H.%M.%S}
  tags:
    - action_diffusion_image
    - pusht_image
    - vision_transformer
    - vit_small
  id: null
  resume: false

# === OUTPUT CONFIGURATION ===
multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${exp_name}
  wandb_name_base: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${exp_name}


# === NOTES ON ViT CONFIGURATION ===
#
# This config uses ViT-Small with the following architecture:
# - Patch size: 8x8 (smaller patches capture more detail on 88x88 images)
# - Embedding dimension: 384 (auto-set by vit_small)
# - Depth: 12 transformer layers
# - Attention heads: 6
# - Input: 88x88 RGB images (cropped from 96x96)
# - Output: 512-dim feature vectors
#
# ViT-Small is chosen because:
# 1. Good balance between performance and computational cost
# 2. Suitable for smaller image sizes (88x88)
# 3. ~22M parameters (vs ~11M for ResNet18, ~86M for ViT-Base)
#
# To use other ViT variants:
# - vit_tiny: Lightweight (5.5M params), faster but may underfit
# - vit_base: Stronger (86M params), may be overkill for this task
# - vit_custom: Fully customizable architecture
#
# Training tips:
# 1. ViT typically needs more regularization (dropout=0.1, weight_decay=0.05)
# 2. Higher learning rate (3e-4 vs 1e-4 for ResNet)
# 3. May need longer training or more data to converge
# 4. Batch size reduced to 64 (from 128) due to higher memory usage
