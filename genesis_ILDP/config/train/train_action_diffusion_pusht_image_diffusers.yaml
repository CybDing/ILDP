# === TRAINING CONFIGURATION FOR ACTION DIFFUSION IMAGE POLICY (DIFFUSERS VERSION) ===
# Uses HuggingFace diffusers library schedulers instead of custom scheduling
# All encoders, UNet, and data pipeline remain the same

_target_: genesis_ILDP.workspace.train_action_diffusion_image_workspace.TrainActionDiffusionImageWorkspace

# === EXPERIMENT SETTINGS ===
exp_name: "action_diffusion_pusht_image_diffusers_DDPM"
task_name: pusht_image_diffusers
name: train_action_diffusion_image_diffusers

# === STANDARD DIFFUSION PARAMETERS ===
horizon: 16
n_action_steps: 8
n_obs_steps: 2
n_latency_steps: 0
dataset_obs_steps: 2
obs_as_global_cond: true
past_action_visible: false
keypoint_visible_rate: 1.0

# === SHAPE METADATA ===
shape_meta:
  action:
    shape: [2]
  obs:
    image:
      shape: [3, 96, 96]
      type: rgb
    agent_pos:
      shape: [2]
      type: low_dim

# === POLICY CONFIGURATION (DIFFUSERS VERSION) ===
policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy_diffusers.ActionDiffusionImagePolicyDiffusers

  # Shape and basic parameters
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_steps: ${n_obs_steps}
  enable_crop: true
  crop_shape: [3, 86, 86]

  # === DIFFUSERS SCHEDULER SETTINGS ===
  diff_steps: 100              # Number of training diffusion steps
  scheduler_type: 'DDPM'       # Scheduler type: 'DDPM', 'DDIM', 'PNDM', 'DPMSolver'
  beta_schedule: 'squaredcos_cap_v2'  # Beta schedule: 'linear', 'scaled_linear', 'squaredcos_cap_v2'
  beta_start: 0.0001           # Starting beta value
  beta_end: 0.02               # Ending beta value
  prediction_type: 'epsilon'   # Prediction type: 'epsilon' (predict noise) or 'sample' (predict x0)
  clip_sample: true            # Clip sample to [-1, 1] range
  num_inference_steps: 100     # Number of inference steps (can be less than diff_steps for DDIM)

  # === ENCODING SETTINGS ===
  img_encoding_dim: 512        # Vision encoder output dimension
  time_encoding_dim: 128       # Time step encoding dimension
  pos_encoding_dim: null       # No positional encoding
  encode_agent_pos: false      # Use raw agent_pos
  vision_backbone: 'resnet18'  # Vision backbone
  vision_pretrained: false     # No pretrained weights
  use_spatial_softmax: false   # Use global average pooling
  spatial_softmax_temp: 1.0

  # === DROPOUT SETTINGS ===
  vision_encoder_dropout: 0.0
  pos_encoder_dropout: 0.0
  unet_dropout: 0.0
  time_encoder_dropout: 0.0

# === TASK CONFIGURATION ===
task:
  name: pusht_image
  shape_meta: ${shape_meta}

  # Dataset configuration
  dataset:
    _target_: genesis_ILDP.dataset.pusht_image_dataset.PushTImageDataset
    zarr_path: genesis_ILDP/data/train_data/merged_data_0925.zarr
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}
    pad_after: ${eval:'${n_action_steps}-1'}
    seed: 42
    val_ratio: 0.05
    max_train_episodes: null    # Use all available episodes

  # Environment runner
  env_runner:
    _target_: genesis_ILDP.env_runner.pusht_image_runner.PushTImageRunner
    output_dir: ${multi_run.run_dir}
    fps: 30
    max_steps: 600
    n_action_steps: ${n_action_steps}
    n_obs_steps: ${n_obs_steps}
    n_test: 60
    n_test_vis: 8
    n_train: 10
    n_train_vis: 2
    test_start_seed: 50000
    train_start_seed: 0
    n_envs: null
    enable_past_action: False
    enable_render: True
    done_ratio: 0.7

# === TRAINING CONFIGURATION ===
training:
  seed: 42
  device: cuda:0
  num_epochs: 500
  batch_size: 64
  deterministic: true
  worker_seed_strategy: offset

  # Learning and optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1

  # Checkpointing and evaluation
  checkpoint_every: 25
  val_every: 5
  rollout_every: 25
  sample_every: 5

  # Limits
  max_train_steps: null
  max_val_steps: null

  # Debugging and logging
  debug: false
  tqdm_interval_sec: 1.0
  use_ema: true
  resume: false

# === OPTIMIZER CONFIGURATION ===
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-05

# === DATA LOADING ===
dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle: true
  drop_last: true

val_dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle: false

# === EMA CONFIGURATION ===
ema:
  _target_: genesis_ILDP.model.common.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# === CHECKPOINT CONFIGURATION ===
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# === LOGGING CONFIGURATION ===
logging:
  mode: online
  project: genesis_ILDP_action_diffusion_diffusers
  group: action_diffusion_pusht_diffusers
  name: ${exp_name}_${now:%Y.%m.%d-%H.%M.%S}
  tags:
    - action_diffusion_image
    - pusht_image
    - diffusers
    - DDPM
  id: null
  resume: false

# === OUTPUT CONFIGURATION ===
multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${exp_name}
  wandb_name_base: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${exp_name}
