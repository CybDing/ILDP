# === TRAINING CONFIGURATION FOR ACTION DIFFUSION IMAGE POLICY ===
# Uses only genesis_ILDP components, no diffusion_policy dependencies

_target_: genesis_ILDP.workspace.train_action_diffusion_image_workspace.TrainActionDiffusionImageWorkspace

# === EXPERIMENT SETTINGS ===
exp_name: "action_diffusion_pusht_image_Cosine_with_Crop"
task_name: pusht_image_ddpm
name: train_action_diffusion_image

# === STANDARD DIFFUSION PARAMETERS (same as original diffusion_policy) ===
horizon: 16                    # Predict 16 action steps (standard setting)
n_action_steps: 8             # Execute first 8 actions (standard setting)  
n_obs_steps: 2                # Use 2 observation frames (standard setting)
n_latency_steps: 0            # No latency compensation
dataset_obs_steps: 2          # Dataset observation steps
obs_as_global_cond: true      # Use observations as global conditioning
past_action_visible: false    # Don't show past actions
keypoint_visible_rate: 1.0    # Not used for image policy

# === SHAPE METADATA ===
shape_meta:
  action:
    shape: [2]                 # 2D action space (x, y coordinates)
  obs:
    image:
      shape: [3, 96, 96]       # RGB images 96x96
      type: rgb
    agent_pos:
      shape: [2]               # 2D agent position
      type: low_dim

# === POLICY CONFIGURATION ===
policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy.ActionDiffusionImagePolicy
  
  # Shape and basic parameters
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_steps: ${n_obs_steps}    # For your custom ActionDiffusion model
  enable_crop: true
  crop_shape: [3, 88, 88]
  
  # Diffusion parameters (standard settings)
  diff_steps: 100              # Number of diffusion steps
  scheduler_mode: 'Cosine'     # Your custom scheduler mode
  # num_inference_steps: 100     # Inference steps

  # Encoding settings
  img_encoding_dim: 512      # IMPORTANT: This parameter is IGNORED when using ResNet18!
                              # - Without spatial_softmax: outputs 512 (from ResNet18's avgpool)
                              # - With spatial_softmax: outputs 1024 (512 channels × 2 coords)
                              # Only used for 'custom' backbone to set FC output dimension
  time_encoding_dim: 128      # Time step encoding dimension
  pos_encoding_dim: null      # No positional encoding
  encode_agent_pos: false      # Set to false to match reference DP architecture

  # === VISION BACKBONE CONFIGURATION ===
  # Available options: 'resnet18', 'custom', 'vit_tiny', 'vit_small', 'vit_base', 'vit_large', 'vit_custom'
  vision_backbone: 'resnet18'  # Vision backbone
  vision_pretrained: false     # Set to false for end-to-end training from scratch
  use_spatial_softmax: false    # Use spatial softmax pooling (only for ResNet, outputs 1024 dims)
  spatial_softmax_temp: 1.0    # Temperature for spatial softmax (lower=sharper, higher=smoother)

  # === VISION TRANSFORMER (ViT) CONFIGURATION ===
  # Uncomment these parameters when using ViT backbones (vit_tiny, vit_small, vit_base, vit_large, vit_custom)
  # vit_patch_size: 16           # Patch size for ViT (8, 16, or 32). Smaller = more patches, more computation
  # vit_depth: 12                # Number of transformer layers (vit_base: 12, vit_large: 24)
  # vit_num_heads: 12            # Number of attention heads (vit_base: 12, vit_large: 16)
  # vit_mlp_ratio: 4.0           # Ratio of MLP hidden dim to embedding dim (standard: 4.0)
  # vit_use_cls_token: true      # Use [CLS] token (true) or global avg pooling (false)
  # vit_embed_dim: 512           # ViT embedding dimension (REQUIRED for vit_custom)
  #                              # Standard dims: vit_tiny=192, vit_small=384, vit_base=768, vit_large=1024

  # === EXAMPLE ViT CONFIGURATIONS ===
  # Example 1: ViT-Small (lightweight, good for smaller images)
  # vision_backbone: 'vit_small'
  # img_encoding_dim: 512        # Output dimension
  # vit_patch_size: 16           # 16x16 patches
  # vit_use_cls_token: true

  # Example 2: ViT-Base (standard configuration)
  # vision_backbone: 'vit_base'
  # img_encoding_dim: 512        # Output dimension
  # vit_patch_size: 16           # 16x16 patches
  # vit_use_cls_token: true

  # Example 3: Custom ViT (fully configurable)
  # vision_backbone: 'vit_custom'
  # img_encoding_dim: 512        # Output dimension
  # vit_patch_size: 8            # Smaller patches for finer details
  # vit_embed_dim: 384           # REQUIRED for vit_custom
  # vit_depth: 6                 # Shallower network
  # vit_num_heads: 6             # Fewer attention heads
  # vit_mlp_ratio: 4.0           # Standard MLP ratio
  # vit_use_cls_token: true      # Use CLS token for classification-like task

  # Dropout settings for regularization (helps prevent overfitting)
  vision_encoder_dropout: 0.0  # Dropout rate for vision encoder MLP (0.0=disabled, try 0.1-0.3)
  pos_encoder_dropout: 0.0     # Dropout rate for position encoder MLP (0.0=disabled, try 0.1-0.3)
  unet_dropout: 0.0            # Dropout rate for UNet FiLM layers (0.0=disabled, try 0.1-0.3)
  time_encoder_dropout: 0.0    # Dropout rate for time encoding MLP (0.0=disabled, try 0.1-0.3)

  # DDIM settings for inference (training uses DDPM)
  # ddim_steps: 15               # Number of DDIM steps for inference
  # noise_intensity: 0.0         # DDIM noise intensity (0.0=deterministic)

# === TASK CONFIGURATION ===
task:
  name: pusht_image
  shape_meta: ${shape_meta}
  
  # Dataset configuration
  dataset:
    _target_: genesis_ILDP.dataset.pusht_image_dataset.PushTImageDataset
    # zarr_path: genesis_ILDP/data/train_data/pusht/pusht_cchi_v7_replay.zarr
    zarr_path: genesis_ILDP/data/train_data/merged_data_0925.zarr
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}     # 1
    pad_after: ${eval:'${n_action_steps}-1'}   # 7  
    seed: 42
    val_ratio: 0.05
    max_train_episodes: null
  
  # Environment runner (optional for training, but good for evaluation)
  env_runner:
    _target_: genesis_ILDP.env_runner.pusht_image_runner.PushTImageRunner
    output_dir: ${multi_run.run_dir}
    fps: 30
    max_steps: 600
    n_action_steps: ${n_action_steps}
    n_obs_steps: ${n_obs_steps}
    n_test: 60
    n_test_vis: 8
    n_train: 10  
    n_train_vis: 2
    # past_action: ${past_action_visible}
    test_start_seed: 50000
    train_start_seed: 0
    n_envs: null
    enable_past_action: False
    enable_render: True
    done_ratio: 0.7

# === TRAINING CONFIGURATION ===  
training:
  seed: 42
  device: cuda:0
  num_epochs: 500             # Standard training epochs
  batch_size: 128               # Batch size
  deterministic: true          # Enable deterministic algorithms for reproducibility
  worker_seed_strategy: offset # offset | independent (controls DataLoader worker seeding)
  
  # Learning and optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1
  
  # Checkpointing and evaluation
  checkpoint_every: 50         # Save checkpoint every 50 epochs
  val_every: 5                 # Validate every epoch  
  rollout_every: 50            # Run environment rollout every 50 epochs
  sample_every: 5              # Sample predictions every 5 epochs
  
  # Limits (null means no limit)
  max_train_steps: null
  max_val_steps: null
  
  # Debugging and logging
  debug: false
  tqdm_interval_sec: 1.0
  use_ema: true                # Use exponential moving average
  resume: false                # Resume from checkpoint if available

# === OPTIMIZER CONFIGURATION ===
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-05

# === DATA LOADING ===
dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true     # Keep workers alive between epochs for better performance
  pin_memory: true             # Optimized for CUDA
  prefetch_factor: 2           # Prefetch batches per worker for better GPU utilization
  shuffle: true
  drop_last: true              # keep batch sizes consistent across epochs for determinism

val_dataloader:
  batch_size: ${training.batch_size}
  num_workers: 8
  persistent_workers: true     # Keep workers alive between epochs for better performance
  pin_memory: true             # Optimized for CUDA
  prefetch_factor: 2           # Prefetch batches per worker for better GPU utilization
  shuffle: false

# === EMA (Exponential Moving Average) CONFIGURATION ===
ema:
  _target_: genesis_ILDP.model.common.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# === CHECKPOINT CONFIGURATION ===
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# === LOGGING CONFIGURATION ===
logging:
  mode: online               # 'online', 'offline', or 'disabled'
  project: genesis_ILDP_action_diffusion
  group: action_diffusion_pusht
  name: ${exp_name}_${now:%Y.%m.%d-%H.%M.%S}
  tags:
    - action_diffusion_image
    - pusht_image
    - genesis
  id: null
  resume: false

# === OUTPUT CONFIGURATION ===
multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${exp_name}
  wandb_name_base: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${exp_name}