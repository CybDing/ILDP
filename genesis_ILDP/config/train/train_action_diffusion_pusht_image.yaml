_target_: genesis_ILDP.workspace.train_action_diffusion_image_workspace.TrainActionDiffusionImageWorkspace

# === EXPERIMENT SETTINGS ===
exp_name: "action_diffusion_pusht_image_Cosine_with_Crop_lr_scale_without_pos_shift"
task_name: pusht_image_ddpm
name: train_action_diffusion_image

# === STANDARD DIFFUSION PARAMETERS (same as original diffusion_policy) ===
horizon: 16                    # Predict 16 action steps (standard setting)
n_action_steps: 8             # Execute first 8 actions (standard setting)  
n_obs_steps: 2                # Use 2 observation frames (standard setting)
n_latency_steps: 0            # No latency compensation
dataset_obs_steps: 2          # Dataset observation steps
obs_as_global_cond: true      # Use observations as global conditioning
past_action_visible: false    # Don't show past actions
keypoint_visible_rate: 1.0    # Not used for image policy

# === WORKSPACE LIMITS (for normalization and augmentation) ===
# Set manual workspace boundaries for consistent normalization
# If null, will compute from data (not recommended if data is incomplete)
workspace_limits: null 
  # xlim: [-0.6, -0.15]               # X-axis workspace range
  # ylim: [0.15, 0.6]               # Y-axis workspace range

# === SHAPE METADATA ===
shape_meta:
  action:
    shape: [2]                 # 2D action space (x, y coordinates)
  obs:
    image:
      shape: [3, 96, 96]       # RGB images 96x96
      type: rgb
    agent_pos:
      shape: [2]               # 2D agent position
      type: low_dim

policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy.ActionDiffusionImagePolicy
  
  # Shape and basic parameters
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_steps: ${n_obs_steps} 
  # variance_threshold: 10
  
  # Diffusion parameters
  diff_steps: 100              # Number of diffusion steps

  use_ddpm: true               # Use DDPM sampling (true) or DDIM (false)
  # ddim_steps: 15               # Number of DDIM steps for inference
  # noise_intensity: 0.0         # DDIM noise intensity (0.0=deterministic ddpm)

  action_x_min: -0.8
  action_x_max: -0.
  action_y_min: 0.
  action_y_max: 0.8

  randn_clip_value: null
  denoised_clip_value: null

  cropper: null # set null to disable cropping
    # _target_: genesis_ILDP.model.vision.crop_randomizer.CropRandomizer
    # input_shape: ${shape_meta.obs.image.shape}
    # crop_height: 84
    # crop_width: 84
    # num_crops: 1
    # pos_enc: false

  shift_augmenter:  
    _target_: genesis_ILDP.model.common.modules.RandomShiftsAug
    pad: 20

  pos_shifter:
    _target_: genesis_ILDP.model.common.modules.RandomPosShifter
    workspace_xlim: [-0.8, 0.0]
    workspace_ylim: [0.0, 0.8]
    shift_ratio: 0.3
    randomness_intensity: 0.2
    max_abs_shift: null        

  imgs_encoding_net:
    _target_: genesis_ILDP.model.vision.cnn_encoding.img_encoding_cnn
    in_channels: 3
    encoded_dim: 512   # This parameter is IGNORED when using ResNet18!
    backbone: 'resnet18'        # Vision backbone
    pretrained: false           # Set to false for end-to-end training from scratch
    use_spatial_softmax: false
    spatial_softmax_temp: 1.0
    input_image_shape: [96, 96]
     # Use cropped shape if cropping enabled, else full image shape
    dropout: 0.0
    # - Without spatial_softmax: outputs 512 (from ResNet18's avgpool)
            # - With spatial_softmax: outputs 1024 (512 channels × 2 coords)
            # Only used for 'custom' backbone to set FC output dimension

  time_encoding:
    _target_: genesis_ILDP.model.encoding.time_encoding
    t_emb_dim: 128
    use_mlp_layer: true
    dropout: 0.0
  
  pos_encoding: null
    # _target_: genesis_ILDP.model.encoding.pos_encoding
    # encoded_dim: 128
    # agent_pos_dim: 2
    # dropout: 0.0
    
  conditioned_unet:
    _target_: genesis_ILDP.model.diffusion.conditioned_unet.Unet
    # dim_mults: [1, 2, 4, 8]
    dim_global_features: ${eval:'${policy.imgs_encoding_net.encoded_dim} * ${n_obs_steps} + ${policy.time_encoding.t_emb_dim} + 2 * ${n_obs_steps}'} # 2 stands for the agent_pos_dim 
    input_dim: 2   
    dropout: 0.0
 
  noise_scheduler:
    _target_: genesis_ILDP.model.common.noise_scheduler.NoiseScheduler
    mode: 'cosine'
    device: 'cuda:0'      
  
# === TASK CONFIGURATION ===
task:
  name: pusht_image
  shape_meta: ${shape_meta}
  
  # Dataset configuration
  dataset:
    _target_: genesis_ILDP.dataset.pusht_image_dataset.PushTImageDataset
    # zarr_path: ../data/train_data/pusht/pusht_cchi_v7_replay.zarr
    zarr_path: ../data/train_data/pusht/pusht_1027_cleaned.zarr
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}     # 1
    pad_after: ${eval:'${n_action_steps}-1'}   # 7
    seed: 42
    val_ratio: 0.05
    max_train_episodes: null
    workspace_limits: ${workspace_limits}      # Pass workspace limits for manual normalization
  
  # Environment runner (optional for training, but good for evaluation)
  env_runner:
    _target_: genesis_ILDP.env_runner.pusht_image_runner.PushTImageRunner
    output_dir: ${multi_run.run_dir}
    fps: 30
    max_steps: 600
    n_action_steps: ${n_action_steps}
    n_obs_steps: ${n_obs_steps}
    n_test: 60
    n_test_vis: 8
    n_train: 10  
    n_train_vis: 2
    # past_action: ${past_action_visible}
    test_start_seed: 50000
    train_start_seed: 0
    n_envs: null
    enable_past_action: False
    enable_render: True
    done_ratio: 0.7
    spawn_center: [-0.3, 0.3]
    spawn_range_scale: 0.5

# === TRAINING CONFIGURATION ===  
training:
  seed: 42
  device: cuda:0
  num_epochs: 500             # Standard training epochs
  batch_size: 64               # Batch size
  deterministic: true          # Enable deterministic algorithms for reproducibility
  worker_seed_strategy: offset # offset | independent (controls DataLoader worker seeding)
  
  # Learning and optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulate_every: 1
  
  # Checkpointing and evaluation
  checkpoint_every: 50         # Save checkpoint every 50 epochs
  val_every: 5                 # Validate every epoch  
  rollout_every: 50            # Run environment rollout every 50 epochs
  sample_every: 5              # Sample predictions every 5 epochs
  
  # Limits (null means no limit)
  max_train_steps: null
  max_val_steps: null
  
  # Debugging and logging
  debug: false
  tqdm_interval_sec: 1.0
  use_ema: true                # Use exponential moving average
  resume: false                # Resume from checkpoint if available

# === OPTIMIZER CONFIGURATION ===
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.95, 0.999]
  eps: 1.0e-08
  weight_decay: 1.0e-05

# === DATA LOADING ===
dataloader:
  batch_size: ${training.batch_size}
  num_workers: 0
  # persistent_workers: true     # Keep workers alive between epochs for better performance
  # pin_memory: true             # Optimized for CUDA
  # prefetch_factor: 2           # Prefetch batches per worker for better GPU utilization
  # shuffle: true
  # drop_last: true              # keep batch sizes consistent across epochs for determinism

val_dataloader:
  batch_size: ${training.batch_size}
  num_workers: 0
  # persistent_workers: true     # Keep workers alive between epochs for better performance
  # pin_memory: true             # Optimized for CUDA
  # prefetch_factor: 2           # Prefetch batches per worker for better GPU utilization
  shuffle: false

# === EMA (Exponential Moving Average) CONFIGURATION ===
ema:
  _target_: genesis_ILDP.model.common.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# === CHECKPOINT CONFIGURATION ===
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# === LOGGING CONFIGURATION ===
logging:
  mode: online               # 'online', 'offline', or 'disabled'
  project: genesis_ILDP_action_diffusion
  group: action_diffusion_pusht
  name: ${exp_name}_${now:%Y.%m.%d-%H.%M.%S}
  tags:
    - action_diffusion_image
    - pusht_image
    - genesis
  id: null
  resume: false

# === OUTPUT CONFIGURATION ===
multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${exp_name}
  wandb_name_base: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${exp_name}