# Enhanced Diffusion Model Evaluation Configuration
# This config allows easy switching of model checkpoints and visualization settings

# === MODEL AND CHECKPOINT SETTINGS ===
checkpoint_path: ./data/checkpoints/latest.ckpt  # CHANGE THIS to your checkpoint path
device: cuda:0  # cuda:0, cuda:1, cpu
use_ema: true  # Use EMA model if available in checkpoint

# === OUTPUT SETTINGS ===
output_dir: ./data/eval_output
success_threshold: 0.8  # Threshold for considering episode successful

# === EVALUATION SETTINGS ===
num_episodes: 10  # Number of episodes to evaluate
seed: 42

# === OBSERVATION AND ACTION CONFIGURATION ===
n_obs_steps: 2    # Number of observation steps
n_action_steps: 8 # Number of action steps per prediction
horizon: 16       # Prediction horizon

# === POLICY CONFIGURATION ===
policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy.ActionDiffusionImagePolicy
  shape_meta:
    action:
      shape: [2]  # [x, y] actions (z is added as constant)
    obs:
      agent_pos:
        shape: [2]
        type: low_dim
      image:
        shape: [3, 96, 96]
        type: rgb

  # Model hyperparameters
  horizon: 16
  n_action_steps: 8
  n_obs_steps: 2
  diff_steps: 100
  scheduler_mode: 'Linear'  # 'Linear', 'Cosine', 'RootLinear'

  # Encoding settings
  encode_agent_pos: false  # IMPORTANT: Set to false to match reference DP
  vision_backbone: 'custom'  # 'custom', 'resnet18', etc.

  # DDIM settings (from advanced section)
  ddim_steps: ${advanced.ddim_steps}
  noise_intensity: ${advanced.noise_intensity}

# === ENVIRONMENT CONFIGURATION ===
env:
  image_shape: [3, 96, 96]  # [C, H, W]
  xlim: 0.2  # X workspace limit
  ylim: 0.2  # Y workspace limit
  fps: 20
  show_fps: true
  show_viewer: true  # Show interactive viewer window
  max_steps: 200     # Maximum steps per episode
  n_envs: 1          # Number of parallel environments
  seeds: [100]       # Environment seeds (list of length n_envs)

# === VISUALIZATION SETTINGS ===
visualization:
  record_video: true      # Record video of evaluation
  save_plots: true        # Save action prediction plots
  plot_every: 5           # Plot every N steps
  show_real_time: false   # Show real-time matplotlib plots (slows down evaluation)

# === LOGGING SETTINGS ===
logging:
  verbose: true          # Print detailed step information
  log_actions: true      # Log action predictions to console
  log_observations: true # Log observation information
  save_trajectories: true # Save complete trajectories to file

# === ANALYSIS SETTINGS ===
analysis:
  compute_action_stats: true    # Compute action distribution statistics
  analyze_temporal_consistency: true  # Analyze temporal consistency of actions
  save_attention_maps: false    # Save attention visualizations (if model supports)

# === DEBUGGING SETTINGS ===
debug:
  save_intermediate_results: false  # Save intermediate diffusion results
  check_gradients: false           # Check for gradient issues
  profile_performance: false       # Profile model inference time

# === ADVANCED SETTINGS ===
advanced:
  # Sampling settings
  ddim_steps: 15        # Number of DDIM steps (optimal: 10-20)
  noise_intensity: 0.0  # Noise intensity (0.0=deterministic, 0.05=slight randomness)

  # Model settings
  eval_fixed_crop: true  # Use fixed cropping during evaluation
  temperature: 1.0       # Sampling temperature

  # Environment settings
  reset_on_failure: true    # Reset environment on task failure
  max_reset_attempts: 3     # Maximum reset attempts per episode