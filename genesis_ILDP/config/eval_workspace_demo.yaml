# === EVALUATION CONFIGURATION ===
# This config is ONLY for evaluation runtime parameters
# All model/policy/dataset settings come from the checkpoint

# === CHECKPOINT PATH ===
checkpoint_path: ./outputs/2024.09.30/14.30.00_action_diffusion/checkpoints/latest.ckpt

# === EVALUATION RUNTIME SETTINGS ===
# Device override (can differ from training)
device: cuda:0               # Options: cuda:0, cpu, mps:0

# Output directory for evaluation results
output_dir: eval_workspace_outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_eval

# === ENVIRONMENT RUNNER PARAMETERS ===
# These override the env_runner settings from checkpoint
env_runner:
  # Test episodes
  n_test: 50                 # Number of test episodes to run
  n_test_vis: 20             # Number of test videos to save
  test_start_seed: 100000    # Starting seed for reproducibility

  # Training episodes (usually 0 for eval-only)
  n_train: 0                 # Number of training episodes (0 for eval)
  n_train_vis: 0             # Number of training videos
  train_start_seed: 0

  # Episode settings
  max_steps: 300             # Maximum steps per episode
  fps: 30                    # Video FPS for rendering
  enable_render: true        # Enable video recording

# === LOGGING ===
logging:
  mode: disabled             # wandb: 'online', 'offline', or 'disabled'
  project: genesis_ILDP_eval
  group: eval_workspace
  name: eval_${now:%Y.%m.%d-%H.%M.%S}

# ============================================================================
# USAGE:
