# === STANDALONE EVALUATION CONFIGURATION ===
# Simple evaluation without training workspace dependency

# === EXPERIMENT SETTINGS ===
exp_name: "eval_action_diffusion_pusht_image"
task_name: pusht_image
name: eval_action_diffusion_image

# === CHECKPOINT SETTINGS ===
checkpoint_path: ./outputs/latest.ckpt  # CHANGE THIS to your checkpoint path
use_ema: true  # Use EMA model if available in checkpoint

# === STANDARD DIFFUSION PARAMETERS (same as training) ===
horizon: 16                    # Predict 16 action steps (standard setting)
n_action_steps: 8             # Execute first 8 actions (standard setting)
n_obs_steps: 2                # Use 2 observation frames (standard setting)
n_latency_steps: 0            # No latency compensation
dataset_obs_steps: 2          # Dataset observation steps
obs_as_global_cond: true      # Use observations as global conditioning
past_action_visible: false    # Don't show past actions
keypoint_visible_rate: 1.0    # Not used for image policy

# === SHAPE METADATA ===
shape_meta:
  action:
    shape: [2]                 # 2D action space (x, y coordinates)
  obs:
    image:
      shape: [3, 96, 96]       # RGB images 96x96
      type: rgb
    agent_pos:
      shape: [2]               # 2D agent position
      type: low_dim

# === POLICY CONFIGURATION ===
policy:
  _target_: genesis_ILDP.policy.action_diffusion_image_policy.ActionDiffusionImagePolicy

  # Shape and basic parameters
  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  obs_steps: ${n_obs_steps}    # For your custom ActionDiffusion model
  enable_crop: true
  crop_shape: [76, 76]

  # Diffusion parameters (same as training)
  diff_steps: 300              # Number of diffusion steps
  scheduler_mode: 'Linear'     # Your custom scheduler mode

  # Encoding settings (IMPORTANT for performance)
  encode_agent_pos: false      # Set to false to match reference DP architecture
  vision_backbone: 'resnet18'  # Vision backbone

  # DDIM settings for inference (faster evaluation)
  ddim_steps: 15               # Number of DDIM steps for inference
  noise_intensity: 0.0         # DDIM noise intensity (0.0=deterministic)

# === TASK CONFIGURATION ===
task:
  name: pusht_image
  shape_meta: ${shape_meta}

  # Environment runner for evaluation
  env_runner:
    _target_: genesis_ILDP.env_runner.pusht_image_runner.PushTImageRunner
    output_dir: ${multi_run.run_dir}
    fps: 30
    max_steps: 300
    n_action_steps: ${n_action_steps}
    n_obs_steps: ${n_obs_steps}
    diff_steps: ${policy.diff_steps}   # Add diff_steps for tqdm calculation
    n_test: 20                         # Number of test episodes
    n_test_vis: 10                     # Number of videos to save
    n_train: 0                         # No training episodes during eval
    n_train_vis: 0
    past_action: ${past_action_visible}
    test_start_seed: 100000
    train_start_seed: 0
    enable_render: true                # Enable video recording
    n_envs: null

# === EVALUATION SETTINGS ===
training:
  device: cuda:0               # Evaluation device
  debug: false
  tqdm_interval_sec: 1.0

# === EMA (same as training) ===
ema:
  _target_: genesis_ILDP.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# === CHECKPOINT CONFIGURATION ===
checkpoint:
  save_last_ckpt: false        # Don't save checkpoints during eval
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# === LOGGING CONFIGURATION ===
logging:
  mode: disabled               # Disable wandb during eval
  project: genesis_ILDP_action_diffusion_eval
  group: action_diffusion_pusht_eval
  name: ${exp_name}_${now:%Y.%m.%d-%H.%M.%S}
  tags:
    - action_diffusion_image_eval
    - pusht_image
    - genesis_ILDP
  id: null
  resume: false

# === OUTPUT CONFIGURATION ===
multi_run:
  run_dir: eval_outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${exp_name}
  wandb_name_base: ${now:%Y.%m.%d}-${now:%H.%M.%S}_${exp_name}